name: IndexNow ping (Bing/Yandex)
on:
  push:
    branches: [master]
jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs to IndexNow
        run: |
          python3 << 'PYEOF'
          import json, re, urllib.request
          KEY = "3faa8c62de6e70679bd59210dcd67507"
          sm = urllib.request.urlopen("https://sabkuchtools.github.io/sabkuch/sitemap.xml", timeout=30).read().decode("utf-8", "ignore")
          urls = re.findall(r"<loc>([^<]+)", sm)
          payload = json.dumps({
            "host": "sabkuchtools.github.io",
            "key": KEY,
            "keyLocation": "https://sabkuchtools.github.io/sabkuch/3faa8c62de6e70679bd59210dcd67507.txt",
            "urlList": urls,
          }).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow",
                                       data=payload,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
            r = urllib.request.urlopen(req, timeout=30)
            print("IndexNow response:", r.status, "- submitted", len(urls), "URLs")
          except Exception as e:
            print("IndexNow submit note:", e)
          PYEOF
